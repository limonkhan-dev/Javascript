<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Submit Event</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  
  <div class="form-section">
    <form action="">
      <div class="field">
        <label for="name">Name :</label>
        <input type="text" id="name" name="name" autocomplete="name" autofocus required>
      </div>

      <div class="field">
        <label for="gender">Gender :</label>

        <input type="radio" name="gender" value="male" checked>
        <label for="male">Male</label>

        <input type="radio" name="gender" value="female">
        <label for="male">Female</label>
      </div>

      <div class="field">
        <label for="phone">Phone :</label>
        <input type="tel" id="phone" name="phone" autocomplete="phone" autofocus required>
      </div>

      <div class="field">
        <label for="email">Email :</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>

      <div class="field">
        <label for="job">Job Status :</label>
        <select name="job" id="job" required>
          <option value="active">Active</option>
          <option value="none">None</option>
        </select>
      </div>

      <div class="field">
        <label for="password">Password :</label>
        <input type="password" id="password" name="password" autocomplete="password" minlength="4" maxlength="8" required>
      </div>

      <div class="field">
        <label for="confirmPass">Confirm Password :</label>
        <input type="password" id="confirmPass" name="confirmPass" autocomplete="confirmPass" required>
      </div>

      <input type="submit" id="submit">
    </form>
  </div>
  <script src="./script.js"></script>
</body>
</html>
